# F-037 — CI dependency / container security scan policy
# See docs/security/dependency-scanning.md

version: 1

# Severities that fail the CI gate unless covered by a non-expired exception.
fail_severities:
  - critical
  - high

# Severities that are reported but do not fail the gate by themselves.
warn_severities:
  - medium
  - low
  - unknown
  - negligible

# Scopes
scopes:
  ruby:
    # bundler-audit covers Gemfile.lock (all groups present in the lockfile).
    # Production image installs without test/development groups — findings in
    # those groups still fail unless excepted (defense in depth for CI/dev).
    fail_on: [critical, high]
  npm:
    # Production gate uses npm audit --omit=dev (runtime/build asset deps).
    # Full audit (including devDependencies) is informational / warn-only unless
    # SEVERITY is critical/high AND present in the production audit report.
    production_omit_dev: true
    fail_on: [critical, high]
  image:
    # OS packages + installed language libs in the deployment image.
    fail_on: [critical, high]
    # Skip secrets scanning noise in this gate (separate concern).
    scanners: [vuln]

# Findings with no known fixed version still fail for fail_severities unless excepted.
unfixable_policy: fail_unless_excepted

# Scanner / advisory DB failures must not be treated as a clean scan.
on_scanner_error: fail
on_missing_advisory_db: fail
on_empty_report_with_error: fail

# Exception file
exceptions_file: config/security/exceptions.yml

# Pinned scanner references (document + CI install)
scanners:
  bundler_audit_gem: "0.9.2"
  trivy_image: "aquasec/trivy:0.58.1"
  # npm audit uses the Node/npm from the CI Node version matrix / container.

ownership:
  review_role: "Security Team (proposed)"
  engineering_role: "Foreman Development (proposed)"
  review_cadence: "At least every 90 days, and on every exception create/renew"

exception_rules:
  max_duration_days: 180
  require_fields:
    - id
    - package
    - reason
    - scope
    - impact
    - mitigation
    - reviewer_role
    - expires_on
    - status
  allowed_status:
    - accepted
    - pending_upgrade
  # status: expired | rejected are ignored / treated as inactive
