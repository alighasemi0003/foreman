# Isolated final verification stack — does NOT use the live lab `db` volume.
#   docker compose -p foreman50-final-verify -f docker-compose.final-verify.yml --env-file .env.final-verify up -d
# Ports bind to loopback high ports to avoid colliding with the existing Foreman stack.
services:
  db:
    image: postgres:12
    environment:
      POSTGRES_USER: foreman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foreman_final_verify}
      POSTGRES_DB: foreman
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foreman -d foreman -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - final_verify_db:/var/lib/postgresql/data

  redis-cache:
    image: redis:7
    restart: unless-stopped

  redis-tasks:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - final_verify_redis_tasks:/data

  app: &app_base
    image: ${FOREMAN_IMAGE:?Set FOREMAN_IMAGE to the SHA-tagged build}
    stop_grace_period: 30s
    command: bash -lc 'exec bundle exec bin/rails server -b 0.0.0.0'
    environment:
      DATABASE_URL: postgres://foreman:${POSTGRES_PASSWORD:-foreman_final_verify}@db/foreman?pool=5
      RAILS_MAX_THREADS: "5"
      FOREMAN_PUMA_THREADS_MIN: "0"
      FOREMAN_PUMA_THREADS_MAX: "5"
      FOREMAN_PUMA_WORKERS: "2"
      RAILS_ENV: production
      FOREMAN_REQUIRE_SSL: "false"
      FOREMAN_FQDN: final-verify.example.com
      FOREMAN_DOMAIN: example.com
      FOREMAN_RAILS_CACHE_STORE_TYPE: redis
      FOREMAN_RAILS_CACHE_STORE_URLS: redis://redis-cache:6379/0
      DYNFLOW_REDIS_URL: redis://redis-tasks:6379/0
      REDIS_PROVIDER: DYNFLOW_REDIS_URL
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}
      SEED_ADMIN_USER: ${SEED_ADMIN_USER:-finaladmin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-finaladmin@example.com}
      FOREMAN_SIGNING_ENABLED: ${FOREMAN_SIGNING_ENABLED:-false}
      FOREMAN_SIGNING_KEY_FILE: ${FOREMAN_SIGNING_KEY_FILE:-}
      FOREMAN_SIGNING_CERT_FILE: ${FOREMAN_SIGNING_CERT_FILE:-}
    hostname: final-verify.example.com
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-tasks:
        condition: service_started
    ports:
      - "127.0.0.1:33000:3000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  orchestrator:
    <<: *app_base
    command: bundle exec sidekiq -r ./extras/dynflow-sidekiq.rb -c 1 -q dynflow_orchestrator
    hostname: orchestrator-final.example.com
    ports: []
    healthcheck:
      disable: true

  worker:
    <<: *app_base
    command: bundle exec sidekiq -r ./extras/dynflow-sidekiq.rb -c 5 -q default,1 -q remote_execution,1
    ports: []
    healthcheck:
      disable: true

volumes:
  final_verify_db:
  final_verify_redis_tasks:
