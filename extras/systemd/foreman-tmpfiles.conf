# F-021 — optional systemd-tmpfiles snippet for packaged Systemd deployments.
# Install as /etc/tmpfiles.d/foreman.conf when using Systemd (not Docker Compose).
#
# Docker Compose lab does NOT use Systemd; see docs/runtime-state-lifecycle.md.
#
# Creates volatile runtime dirs. Application PID/state under the Foreman
# WorkingDirectory/tmp remain managed by Foreman::RuntimeStateLifecycle and
# extras/containers/safe_clean_runtime_state.rb (ExecStartPre).

d /run/foreman 0750 foreman foreman -
d /run/foreman/pids 0750 foreman foreman -
d /run/foreman/sockets 0750 foreman foreman -
