services:
  db:
    image: postgres:12
    hostname: db.example.com
    environment:
      - POSTGRES_USER=foreman
      - POSTGRES_PASSWORD=foreman
      - POSTGRES_DB=foreman
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - '5432'
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foreman"]
      interval: 30s
      timeout: 30s
      retries: 3
    volumes:
      - db:/var/lib/postgresql/data

  app: &app_base
    image: foreman-local:reauth
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -lc 'rm -f tmp/pids/server.pid && chmod +x bin/* 2>/dev/null; exec bundle exec rails server -b 0.0.0.0'
    working_dir: /home/foreman
    environment:
      - DATABASE_URL=postgres://foreman:foreman@db/foreman?pool=5
      - RAILS_MAX_THREADS=5
      - RAILS_ENV=production
      # Local compose serves HTTP on :3000 — do not enforce force_ssl here.
      # Real Production must omit this (defaults to HTTPS) or set FOREMAN_REQUIRE_SSL=true.
      - FOREMAN_REQUIRE_SSL=false
      - BUNDLE_WITHOUT=test:development:openid:libvirt:journald:facter:console:assets
      - FOREMAN_FQDN=foreman.example.com
      - FOREMAN_DOMAIN=example.com
      - FOREMAN_RAILS_CACHE_STORE_TYPE=redis
      - FOREMAN_RAILS_CACHE_STORE_URLS=redis://redis-cache:6379/0
      - DYNFLOW_REDIS_URL=redis://redis-tasks:6379/0
      - REDIS_PROVIDER=DYNFLOW_REDIS_URL
    hostname: foreman.example.com
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-tasks:
        condition: service_started
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - ./app:/home/foreman/app
      - ./db/migrate:/home/foreman/db/migrate
      - ./lib:/home/foreman/lib
      - ./extras:/home/foreman/extras
      - ./config/routes.rb:/home/foreman/config/routes.rb
      - ./config/application.rb:/home/foreman/config/application.rb
      - ./config/settings.rb:/home/foreman/config/settings.rb
      - ./config/environments/production.rb:/home/foreman/config/environments/production.rb
      - ./config/initializers/f_foreman_permissions.rb:/home/foreman/config/initializers/f_foreman_permissions.rb
      - ./config/initializers/f_foreman_settings_auth.rb:/home/foreman/config/initializers/f_foreman_settings_auth.rb
      - ./config/initializers/secure_headers.rb:/home/foreman/config/initializers/secure_headers.rb
      # Host-built webpack bundle (includes Reauthentication modal/retry)
      - ./public/webpack:/home/foreman/public/webpack
      - ./webpack/assets/javascripts/react_app/components/LoginPage:/home/foreman/webpack/assets/javascripts/react_app/components/LoginPage
      - ./webpack/assets/javascripts/react_app/common/Reauthentication.js:/home/foreman/webpack/assets/javascripts/react_app/common/Reauthentication.js
      - ./webpack/assets/javascripts/react_app/redux/API/APIRequest.js:/home/foreman/webpack/assets/javascripts/react_app/redux/API/APIRequest.js

  orchestrator:
    <<: *app_base
    command: bundle exec sidekiq -r ./extras/dynflow-sidekiq.rb -c 1 -q dynflow_orchestrator
    hostname: orchestrator.example.com
    ports: []

  worker:
    <<: *app_base
    command: bundle exec sidekiq -r ./extras/dynflow-sidekiq.rb -c 15 -q default,1 -q remote_execution,1
    hostname: worker.example.com
    ports: []

  redis-cache:
    image: redis

  redis-tasks:
    image: redis
    command: redis-server --appendonly yes
    volumes:
      - redis-persistent:/data

volumes:
  db:
  redis-persistent:
