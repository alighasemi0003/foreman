# Ephemeral compose for Foreman Account Lockout validation (not production).
services:
  postgres:
    image: postgres:12
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    working_dir: /app
    volumes:
      - .:/app
      - foreman_test_bundle:/bundle
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:password@postgres/test
      DATABASE_CLEANER_ALLOW_REMOTE_DATABASE_URL: "true"
      BUNDLE_PATH: /bundle
      BUNDLE_WITHOUT: "console:development:journald:libvirt:vmware:openstack:ec2:openid:facter:telemetry"
    depends_on:
      postgres:
        condition: service_healthy
    command: sleep infinity

volumes:
  foreman_test_bundle:
